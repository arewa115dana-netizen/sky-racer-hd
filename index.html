<!DOCTYPE html>
<!--
  ファイル名 : index.html
  保存場所   : / （リポジトリのいちばん上）
  役割       : ゲームの入口。画面の土台、Three.jsの読み込み設定、エラー表示の準備
  バージョン : 0.1.0（Phase1 動作確認版）
-->
<html lang="ja" data-version="0.1.0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1530">
  <title>Sky Racer HD</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- エラーを画面に表示する仕組み（ゲーム本体より先に動かす） -->
  <script>
    (function () {
      function showError(message) {
        var box = document.getElementById('error');
        if (!box) {
          window.addEventListener('DOMContentLoaded', function () { showError(message); });
          return;
        }
        box.style.display = 'block';
        box.textContent += message + '\n\n';
      }
      window.__showError = showError;

      window.addEventListener('error', function (e) {
        if (e && e.message) {
          var where = e.filename ? '\n場所: ' + e.filename + ' (' + e.lineno + '行目)' : '';
          showError('エラー: ' + e.message + where);
        } else if (e && e.target && (e.target.src || e.target.href)) {
          showError('読み込み失敗: ' + (e.target.src || e.target.href));
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : '不明';
        showError('エラー(非同期): ' + reason);
      });

      // 10秒たってもゲームが起動しなければ知らせる
      setTimeout(function () {
        if (!window.__SKY_READY) {
          showError('起動できませんでした。\n・通信状態を確認して再読み込みしてください\n・js/main.js のファイル名と保存場所を確認してください');
        }
      }, 10000);
    })();
  </script>

  <!-- Three.js の読み込み設定（バージョン固定：0.184.0） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="info">起動中...</div>
  </div>

  <div id="version">v0.1.0</div>

  <div id="rotate">
    <div class="rotate-box">
      <div class="rotate-icon">⟳</div>
      <div>スマホを横向きにしてください</div>
    </div>
  </div>

  <pre id="error"></pre>

  <script type="module" src="js/main.js"></script>
</body>
</html>
